name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:no-paid-inference
      - run: pnpm fixtures:validate
      - run: pnpm build:web
  rules-cpp:
    # Engine-free combat/encounter rules shared with the Unreal module (game/Source/Ender/Rules).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tests/cpp/run.sh
      - run: CXX=clang++ tests/cpp/run.sh
