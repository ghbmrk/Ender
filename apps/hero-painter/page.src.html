<title>Ender Hero Painter</title>
<style>
@font-face { font-family: "Alegreya SC"; font-weight: 700; src: url(__FONT_SC700__) format("woff2"); font-display: swap; }
@font-face { font-family: "Atkinson Hyperlegible"; font-weight: 400; src: url(__FONT_AT400__) format("woff2"); font-display: swap; }
@font-face { font-family: "Atkinson Hyperlegible"; font-weight: 700; src: url(__FONT_AT700__) format("woff2"); font-display: swap; }
/* Layout: one portrait screen in two states. Choosing: a sigil of gathering threads fills the stage while the
   choices sit in the thumb zone. Revealed: the painted hero fills the stage over the backdrop, seen over the shoulder. */
:root {
  --ink: #1d1822; --slate: #2a2533; --stone: #3a3142; --line: #4d4257;
  --text: #f1e9dc; --dim: #b9adc4; --gold: #ecc56a; --gold-deep: #c9953a; --thread: #9fc3ff; --violet: #c9a8ff;
  --display: "Alegreya SC", "Palatino Linotype", Georgia, serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--ink); color: var(--text); font: 16px/1.4 var(--body); -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
#app { max-width: 480px; margin: 0 auto; min-height: 100%; display: grid; grid-template-rows: minmax(300px, 1fr) auto; }
button { cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--thread); outline-offset: 2px; }
[hidden] { display: none !important; }

.stage { position: relative; overflow: hidden; background: #120f17; min-height: 46vh; }
#backdrop { position: absolute; inset: 0; background: center / cover no-repeat; opacity: 0; transition: opacity .6s; }
.revealed #backdrop { opacity: 1; }
.stage::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(18,15,23,.1) 0%, rgba(18,15,23,0) 45%, rgba(29,24,34,.92) 100%); pointer-events: none; z-index: 3; }
#hero { position: absolute; left: -12%; bottom: -14%; width: 106%; aspect-ratio: 1; z-index: 2; opacity: 0; }
#fx { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 4; pointer-events: none; }
#flash { position: absolute; inset: 0; z-index: 5; background: radial-gradient(circle at 45% 55%, #fffaf0, #ffe7b0 40%, rgba(255,231,176,0) 75%); opacity: 0; pointer-events: none; }
.title { position: absolute; z-index: 6; top: 14px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.title h1 { margin: 0; font: 700 22px/1 var(--display); color: var(--gold); letter-spacing: .04em; text-shadow: 0 2px 8px #000; }
.title span { font-size: 12px; color: var(--dim); text-shadow: 0 1px 4px #000; text-align: right; font-variant-numeric: tabular-nums; }
.say { position: absolute; z-index: 6; left: 16px; right: 16px; bottom: 12px; font-size: 15px; text-shadow: 0 1px 6px #000; min-height: 21px; }
.power { position: absolute; z-index: 6; left: 16px; top: 46px; display: flex; align-items: baseline; gap: 8px; font: 700 13px var(--display); letter-spacing: .1em; color: var(--dim); }
.power b { font-size: 26px; color: var(--gold); letter-spacing: 0; text-shadow: 0 0 12px rgba(236,197,106,.6); font-variant-numeric: tabular-nums; transition: transform .15s; display: inline-block; }
.power b.bump { transform: scale(1.35); }

.panel { padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; background: var(--ink); }
.row { display: grid; gap: 7px; }
.label { font: 700 13px/1 var(--display); letter-spacing: .08em; color: var(--dim); }
.chips { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.chip { min-height: 46px; border-radius: 23px; border: 1px solid var(--line); background: var(--slate); color: var(--text); font: 700 15px var(--body); }
.chip[aria-pressed="true"] { border-color: var(--gold); background: #3b3020; color: var(--gold); box-shadow: 0 0 14px rgba(236,197,106,.25); }
.pal { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.sw { height: 44px; border-radius: 22px; border: 2px solid var(--line); padding: 0; background: linear-gradient(110deg, var(--a) 0 55%, var(--b) 55% 100%); }
.sw[aria-pressed="true"] { border-color: var(--gold); box-shadow: 0 0 0 2px var(--ink), 0 0 0 4px var(--gold), 0 0 16px var(--a); }
.loom { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.aff { display: grid; gap: 5px; justify-items: start; min-height: 52px; padding: 8px 10px; border-radius: 10px; background: var(--slate); border: 1px solid var(--line); color: var(--text); font: 700 14px var(--body); text-align: left; }
.aff[data-r="1"], .aff[data-r="2"], .aff[data-r="3"] { border-color: var(--glow); box-shadow: inset 0 0 calc(var(--rank) * 10px) color-mix(in srgb, var(--glow) 35%, transparent); }
.pips { display: flex; gap: 4px; }
.pip { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--line); }
.pip.on { background: var(--glow); border-color: var(--glow); box-shadow: 0 0 6px var(--glow); }
.foot { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: center; }
.ghost { min-height: 52px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: transparent; color: var(--text); font: 700 15px var(--body); }
.go { min-height: 58px; border-radius: 14px; border: 0; background: linear-gradient(180deg, var(--gold), var(--gold-deep)); color: #2a1a05; font: 700 20px var(--display); letter-spacing: .05em; position: relative; overflow: hidden; }
.go:disabled { filter: grayscale(.8) brightness(.6); }
.go::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.55) 50%, transparent 70%); transform: translateX(-100%); }
.go.charged::after { animation: sheen 1.8s ease-in-out infinite; }
@keyframes sheen { to { transform: translateX(100%); } }
.stats { font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; min-height: 18px; }
.stats b { color: var(--text); }
.err { color: #ff9a8a; }
.revealed .choose { display: none; }
.after { display: none; }
.revealed .after { display: grid; }
@media (prefers-reduced-motion: reduce) { .go.charged::after { animation: none; } #backdrop { transition: none; } }
</style>
<div id="app">
  <section class="stage" id="stage">
    <div id="backdrop"></div>
    <canvas id="hero" width="512" height="512" aria-label="Your painted hero"></canvas>
    <canvas id="fx"></canvas>
    <div id="flash"></div>
    <div class="title"><h1>Weave your hero</h1><span id="net"></span></div>
    <div class="power choose" id="powerRow">POWER <b id="power">0</b></div>
    <div class="say" id="say">Choose what your hero wears. Every choice feeds the Loom.</div>
  </section>
  <section class="panel">
    <div class="row choose">
      <div class="label">Garb</div>
      <div class="chips" id="garb"></div>
    </div>
    <div class="row choose">
      <div class="label">Colours</div>
      <div class="pal" id="pal"></div>
    </div>
    <div class="row choose">
      <div class="label">Loom ranks &middot; tap to raise</div>
      <div class="loom" id="loom"></div>
    </div>
    <div class="foot choose">
      <button class="ghost" id="reroll" type="button">New face</button>
      <button class="go" id="go" type="button" disabled>Reveal</button>
    </div>
    <div class="row after">
      <div class="stats" id="stats"></div>
      <div class="foot">
        <button class="ghost" id="again" type="button">New face</button>
        <button class="go charged" id="back" type="button">Weave again</button>
      </div>
    </div>
  </section>
</div>
<script type="module">
__ENGINE__

const $ = (id) => document.getElementById(id);
$("backdrop").style.backgroundImage = "url(bg-hollow-keep.webp)";

const GARBS = [["armour", "Plate"], ["leathers", "Leathers"], ["robes", "Robes"]];
const PALS = [["#9a2a39", "#c9953a"], ["#23408f", "#6a44a3"], ["#1c605a", "#9a6535"], ["#43296f", "#c9953a"], ["#35323a", "#9a2a39"], ["#8f6420", "#1c605a"], ["#d8cfb8", "#23408f"], ["#4a2a15", "#2c8f84"]];
const PAL_NAMES = ["Oxblood and gold", "Sapphire and violet", "Verdigris and rust", "Violet and gold", "Ash and blood", "Ochre and teal", "Bone and sapphire", "Leather and verdigris"];
const AFFS = [["burden", "Burden"], ["veil", "Veil"], ["reach", "Reach"], ["knots", "Knots"], ["flex", "Flex"], ["bond", "Bond"]];
const GLOWS = { burden: "#ffb35c", veil: "#c9a8ff", reach: "#9fc3ff", knots: "#ffd98a", flex: "#7dffd6", bond: "#ff8a7a" };

const state = { garb: null, pal: null, seed: (Math.random() * 2 ** 31) | 0, ranks: Object.fromEntries(AFFS.map(([k]) => [k, 0])) };
const ready = () => state.garb !== null && state.pal !== null;
const power = () => (state.garb ? 3 : 0) + (state.pal !== null ? 3 : 0) + Object.values(state.ranks).reduce((a, b) => a + b, 0) * 2;
const MAXP = 6 + 18 * 2;

function traits() {
  const ranks = AFFS.map(([k]) => [k, state.ranks[k]]).filter(([, r]) => r > 0).sort((a, b) => b[1] - a[1]).slice(0, 3);
  return [`look.${state.garb}.${state.pal}`, ...ranks.map(([k, r]) => `${k}.${r}`), `weapon.${state.garb}`, "view", "bg", "style"];
}
const keyOf = () => JSON.stringify([traits(), state.seed]);
function colours() {
  const c = [];
  if (state.pal !== null) c.push(...PALS[state.pal]);
  for (const [k] of AFFS) if (state.ranks[k]) c.push(GLOWS[k]);
  return c.length ? c : ["#9fc3ff", "#c9a8ff"];
}

// ---------- controls ----------
function renderControls() {
  $("garb").innerHTML = GARBS.map(([k, n]) => `<button class="chip" type="button" data-garb="${k}" aria-pressed="${state.garb === k}">${n}</button>`).join("");
  $("pal").innerHTML = PALS.map(([a, b], i) => `<button class="sw" type="button" data-pal="${i}" aria-label="${PAL_NAMES[i]}" aria-pressed="${state.pal === i}" style="--a:${a};--b:${b}"></button>`).join("");
  $("loom").innerHTML = AFFS.map(([k, n]) => `<button class="aff" type="button" data-aff="${k}" data-r="${state.ranks[k]}" style="--glow:${GLOWS[k]};--rank:${state.ranks[k]}" aria-label="${n}, rank ${state.ranks[k]} of 3">${n}<span class="pips">${[1, 2, 3].map((r) => `<i class="pip${state.ranks[k] >= r ? " on" : ""}"></i>`).join("")}</span></button>`).join("");
  const p = power();
  $("power").textContent = p;
  $("power").classList.remove("bump"); void $("power").offsetWidth; $("power").classList.add("bump");
  setTimeout(() => $("power").classList.remove("bump"), 160);
  $("go").disabled = !ready();
  $("go").classList.toggle("charged", ready());
  $("say").textContent = !state.garb ? "Choose what your hero wears. Every choice feeds the Loom." : state.pal === null ? "Now their colours." : "Raise Loom ranks to gather more power, or reveal your hero.";
}
renderControls();

document.querySelector(".panel").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  let burst = null;
  if (b.dataset.garb) { state.garb = b.dataset.garb; burst = colours()[0]; }
  else if (b.dataset.pal) { state.pal = +b.dataset.pal; burst = PALS[state.pal][0]; }
  else if (b.dataset.aff) { const k = b.dataset.aff; state.ranks[k] = (state.ranks[k] + 1) % 4; burst = GLOWS[k]; }
  else return;
  // paint the pressed state first, then do the rest
  requestAnimationFrame(() => { renderControls(); fx.feed(burst, power() / MAXP, colours()); schedule(); });
});
$("reroll").addEventListener("click", () => { state.seed = (Math.random() * 2 ** 31) | 0; fx.feed("#fff6dc", power() / MAXP, colours()); schedule(); });
$("go").addEventListener("click", () => reveal());
$("back").addEventListener("click", () => backToChoices());
$("again").addEventListener("click", () => { backToChoices(); state.seed = (Math.random() * 2 ** 31) | 0; schedule(); reveal(); });

// ---------- the painter, loading in the background from the moment the page opens ----------
let painter = null, loadErr = null;
const CACHE = "ender-painter-v1";
async function cachedFetch(url) {
  let cache = null;
  try { cache = await caches.open(CACHE); const hit = await cache.match(url); if (hit) return hit.arrayBuffer(); } catch {}
  const r = await fetch(url);
  if (!r.ok) throw new Error(`Download failed (${r.status}) for ${url}.`);
  if (cache) { try { await cache.put(url, r.clone()); } catch {} }
  return r.arrayBuffer();
}
const t0 = performance.now();
(async () => {
  if (!navigator.gpu) throw new Error("This browser has no WebGPU, so it can't paint heroes. Safari on iOS 26 or recent Chrome on Android can.");
  const manifest = await (await fetch("model/manifest.json")).json();
  painter = await createPainter({
    manifest,
    fetchChunk: (f) => cachedFetch("model/" + f),
    onProgress: (p) => { $("net").textContent = p < 1 ? `Gathering threads ${Math.round(p * 100)}%` : ""; },
  });
  $("net").textContent = "";
  stats.load = (performance.now() - t0) / 1000;
  schedule();
})().catch((e) => { loadErr = e; $("net").innerHTML = `<span class="err">${e.message}</span>`; if (waiting) failReveal(); });

// ---------- background painting: always paint the newest choices, keep the result out of sight ----------
const stats = { load: 0 };
let done = null, running = false, timer = 0, waiting = false;
function schedule() {
  clearTimeout(timer);
  if (!painter || !ready()) return;
  timer = setTimeout(paintLatest, waiting ? 0 : 250);
}
async function paintLatest() {
  if (running || !painter || !ready()) return;
  const key = keyOf();
  if (done?.key === key) { if (waiting) show(); return; }
  running = true;
  try {
    const t = performance.now();
    const r = await painter.paint({ traits: traits(), seed: state.seed });
    const tm = performance.now();
    const m = await painter.matte(r.rgba);
    const img = await createImageBitmap(applyMatte(r.rgba, m));
    done = { key, img, ms: { ...r.ms, cut: performance.now() - tm, total: performance.now() - t } };
  } catch (e) { loadErr = e; }
  running = false;
  if (loadErr && waiting) return failReveal();
  if (keyOf() !== done?.key) return schedule();
  if (waiting) show();
}

function applyMatte(rgba, m) {
  const W = 512, S = 320, px = new Uint8ClampedArray(rgba);
  if (m) for (let y = 0; y < W; y++) {
    const sy = Math.max(0, (y + 0.5) * S / W - 0.5), y0 = Math.min(S - 1, sy | 0), y1 = Math.min(S - 1, y0 + 1), fy = sy - y0;
    for (let x = 0; x < W; x++) {
      const sx = Math.max(0, (x + 0.5) * S / W - 0.5), x0 = Math.min(S - 1, sx | 0), x1 = Math.min(S - 1, x0 + 1), fx = sx - x0;
      const v = (m[y0 * S + x0] * (1 - fx) + m[y0 * S + x1] * fx) * (1 - fy) + (m[y1 * S + x0] * (1 - fx) + m[y1 * S + x1] * fx) * fy;
      px[(y * W + x) * 4 + 3] = Math.min(1, Math.max(0, (v - 0.08) / 0.84)) * 255;
    }
  }
  return new ImageData(px, W, W);
}

// ---------- reveal ----------
function reveal() {
  if (!ready()) return;
  waiting = true;
  $("go").disabled = true;
  $("say").textContent = "The Loom draws tight…";
  fx.climax(true);
  if (loadErr) return failReveal();
  if (done?.key === keyOf()) return show();
  if (!painter) $("say").textContent = "The Loom draws tight… still gathering threads.";
  schedule();
}
function failReveal() {
  waiting = false; fx.climax(false);
  $("say").innerHTML = `<span class="err">${loadErr.message}</span>`;
  $("go").disabled = false;
}
async function show() {
  waiting = false;
  const { img, ms } = done;
  await fx.burst();                    // threads collapse, white flash
  const c = $("hero").getContext("2d");
  c.clearRect(0, 0, 512, 512); c.drawImage(img, 0, 0);
  document.getElementById("app").classList.add("revealed");
  $("hero").animate([{ opacity: 0, transform: "scale(1.18)", filter: "brightness(2.4) blur(6px)" }, { opacity: 1, transform: "scale(1)", filter: "brightness(1) blur(0)" }], { duration: 900, easing: "cubic-bezier(.2,.8,.2,1)", fill: "forwards" });
  $("flash").animate([{ opacity: 1 }, { opacity: 0 }], { duration: 900, easing: "ease-out", fill: "forwards" });
  fx.afterglow(colours());
  const ranks = AFFS.filter(([k]) => state.ranks[k]).map(([k, n]) => `${n} ${state.ranks[k]}`);
  $("say").textContent = ranks.length ? `Woven with ${ranks.join(", ")}.` : "Woven from the Loom.";
  $("stats").innerHTML = `Painted on this phone in <b>${(ms.total / 1000).toFixed(1)} s</b> (model ${(ms.unet / 1000).toFixed(1)}, image ${(ms.decode / 1000).toFixed(1)}, cutout ${(ms.cut / 1000).toFixed(1)}) &middot; threads loaded in ${stats.load.toFixed(0)} s`;
}
function backToChoices() {
  document.getElementById("app").classList.remove("revealed");
  $("hero").getAnimations().forEach((a) => a.cancel());
  $("hero").style.opacity = 0;
  fx.reset(power() / MAXP, colours());
  renderControls();
}

// ---------- the Loom sigil: threads that gather as power rises ----------
const fx = (() => {
  const c = $("fx"), g = c.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W = 0, H = 0, dpr = 1;
  const size = () => { const r = c.getBoundingClientRect(); dpr = Math.min(2, devicePixelRatio || 1); W = r.width; H = r.height; c.width = W * dpr; c.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0); };
  size(); addEventListener("resize", size);
  let level = 0, shown = 0, cols = ["#9fc3ff", "#c9a8ff"], threads = [], rings = [], motes = [], mode = "gather", climaxT = 0, after = 0;
  const cx = () => W * 0.5, cy = () => H * 0.5;
  const spawn = (col) => {
    const a = Math.random() * Math.PI * 2, R = Math.max(W, H) * (0.45 + Math.random() * 0.2);
    return { a, r0: R, life: 0, speed: 0.008 + Math.random() * 0.012, w: 0.6 + Math.random() * 1.8, col: col || cols[(Math.random() * cols.length) | 0], twist: (Math.random() - 0.5) * 2.4 };
  };
  function frame(now) {
    g.clearRect(0, 0, W, H);
    shown += (level - shown) * 0.06;
    const k = mode === "climax" ? 1 : shown;
    const want = Math.round(24 + k * 170);
    if (mode !== "after") while (threads.length < want) threads.push(spawn());
    const X = cx(), Y = cy(), core = 18 + k * 60;
    g.lineCap = "round";
    for (const t of threads) {
      t.life += t.speed * (mode === "climax" ? 3.2 : 1 + k);
      if (t.life >= 1) { if (mode === "after" || threads.length > want) { t.dead = true; continue; } Object.assign(t, spawn()); continue; }
      const e = t.life * t.life, r = t.r0 * (1 - e) + core * 0.3 * e, a = t.a + t.twist * e;
      const r2 = t.r0 * (1 - Math.max(0, e - 0.22)), a2 = t.a + t.twist * Math.max(0, e - 0.22);
      g.strokeStyle = t.col; g.globalAlpha = (0.3 + 0.65 * t.life) * (mode === "after" ? 0.5 : 1); g.lineWidth = t.w;
      g.beginPath(); g.moveTo(X + Math.cos(a2) * r2, Y + Math.sin(a2) * r2 * 1.2); g.lineTo(X + Math.cos(a) * r, Y + Math.sin(a) * r * 1.2); g.stroke();
    }
    threads = threads.filter((t) => !t.dead);
    // the sigil: three rings, one lit per kind of choice, spinning faster as power rises
    if (mode !== "after") {
      const spin = now / 1000 * (0.3 + k * 1.6);
      const lit = [state.garb ? 1 : 0.15, state.pal !== null ? 1 : 0.15, Math.min(1, 0.15 + Object.values(state.ranks).reduce((a, b) => a + b, 0) / 9)];
      [core * 1.0, core * 1.45, core * 1.95].forEach((R, i) => {
        g.globalAlpha = 0.25 + 0.6 * lit[i]; g.strokeStyle = cols[i % cols.length]; g.lineWidth = 1.5 + lit[i] * 1.5;
        g.setLineDash([R * 0.5, R * 0.18]); g.beginPath(); g.ellipse(X, Y, R, R * 1.1, (i % 2 ? -1 : 1) * spin * (1 + i * 0.3), 0, Math.PI * 2); g.stroke();
      });
      g.setLineDash([]);
      const glow = g.createRadialGradient(X, Y, 0, X, Y, core * 2.6);
      glow.addColorStop(0, "rgba(255,246,220," + (0.25 + k * 0.6) + ")"); glow.addColorStop(0.35, cols[0] + "88"); glow.addColorStop(1, "transparent");
      g.globalAlpha = mode === "climax" ? 0.9 + 0.1 * Math.sin(now / 40) : 0.6 + 0.15 * Math.sin(now / 300);
      g.fillStyle = glow; g.fillRect(X - core * 3, Y - core * 3, core * 6, core * 6);
    }
    for (const r of rings) { r.t += 1 / 40; if (r.t <= 0) continue; g.globalAlpha = Math.max(0, 1 - r.t); g.strokeStyle = r.col; g.lineWidth = 3 * (1 - r.t) + 0.5; g.beginPath(); g.ellipse(X, Y, 20 + r.t * r.R, (20 + r.t * r.R) * 1.1, 0, 0, Math.PI * 2); g.stroke(); }
    rings = rings.filter((r) => r.t < 1);
    if (Math.random() < 0.3 + k) motes.push({ x: X + (Math.random() - 0.5) * W * 0.8, y: Y + H * 0.4, v: 0.5 + Math.random() * 1.5, a: 1, c: cols[(Math.random() * cols.length) | 0] });
    for (const m of motes) { m.y -= m.v; m.a -= 0.01; g.globalAlpha = Math.max(0, m.a) * 0.8; g.fillStyle = m.c; g.fillRect(m.x, m.y, 2, 2); }
    motes = motes.filter((m) => m.a > 0);
    g.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  return {
    feed(col, lv, cs) {
      level = lv; cols = cs;
      rings.push({ t: 0, R: Math.max(W, H) * 0.6, col });
      if (!reduce) for (let i = 0; i < 36; i++) threads.push(spawn(col));
    },
    climax(on) { mode = on ? "climax" : "gather"; climaxT = performance.now(); },
    burst() {
      return new Promise((res) => {
        const wait = Math.max(0, 700 - (performance.now() - climaxT)); // let the climax build at least a moment
        setTimeout(() => {
          rings.push({ t: 0, R: Math.max(W, H) * 1.2, col: "#fff6dc" }, { t: -0.15, R: Math.max(W, H), col: cols[0] });
          $("flash").animate([{ opacity: 0 }, { opacity: 1 }], { duration: 160, fill: "forwards" }).finished.then(res);
        }, reduce ? 0 : wait);
      });
    },
    afterglow(cs) { cols = cs; mode = "after"; },
    reset(lv, cs) { level = lv; cols = cs; mode = "gather"; },
  };
})();
</script>
