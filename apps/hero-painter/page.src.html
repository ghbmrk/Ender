<title>Ender Hero Painter</title>
<style>
@font-face { font-family: "Alegreya SC"; font-weight: 700; src: url(__FONT_SC700__) format("woff2"); font-display: swap; }
@font-face { font-family: "Atkinson Hyperlegible"; font-weight: 400; src: url(__FONT_AT400__) format("woff2"); font-display: swap; }
@font-face { font-family: "Atkinson Hyperlegible"; font-weight: 700; src: url(__FONT_AT700__) format("woff2"); font-display: swap; }
/* Layout: one portrait screen. The painted hero fills the upper stage over the Hollow Keep backdrop,
   seen over the shoulder and cropped at the knee; every control sits in the lower thumb zone, primary action bottom-right. */
:root {
  --ink: #1d1822; --slate: #2a2533; --stone: #3a3142; --line: #4d4257;
  --text: #f1e9dc; --dim: #b9adc4; --gold: #ecc56a; --gold-deep: #c9953a; --thread: #9fc3ff; --violet: #c9a8ff; --ember: #ffb35c;
  --display: "Alegreya SC", "Palatino Linotype", Georgia, serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--ink); color: var(--text); font: 16px/1.4 var(--body); -webkit-tap-highlight-color: transparent; }
#app { max-width: 480px; margin: 0 auto; min-height: 100%; display: grid; grid-template-rows: minmax(300px, 56vh) auto; }
.stage { position: relative; overflow: hidden; background: #120f17 center / cover no-repeat; }
.stage::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(18,15,23,.15) 0%, rgba(18,15,23,0) 40%, rgba(29,24,34,.9) 100%); pointer-events: none; }
#hero, #fx { position: absolute; left: -12%; bottom: -14%; width: 106%; aspect-ratio: 1; }
#hero { filter: drop-shadow(0 0 18px rgba(0,0,0,.6)); }
#fx { pointer-events: none; mix-blend-mode: screen; z-index: 2; }
.title { position: absolute; z-index: 3; top: 14px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.title h1 { margin: 0; font: 700 22px/1 var(--display); color: var(--gold); letter-spacing: .04em; text-shadow: 0 2px 8px #000; }
.title span { font-size: 13px; color: var(--dim); text-shadow: 0 1px 4px #000; text-align: right; }
.say { position: absolute; z-index: 3; left: 16px; right: 16px; bottom: 12px; font-size: 14px; color: var(--text); text-shadow: 0 1px 6px #000; min-height: 20px; }
#prev { position: absolute; z-index: 3; right: 12px; top: 48px; width: 76px; height: 76px; border: 2px solid var(--gold-deep); border-radius: 50%; background: var(--slate) center 18% / 170% no-repeat; box-shadow: 0 2px 10px #000; }
#prev::after { content: "before"; position: absolute; bottom: -18px; left: 0; right: 0; text-align: center; font-size: 11px; color: var(--dim); text-shadow: 0 1px 3px #000; }
.panel { padding: 14px 16px calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; background: var(--ink); }
.row { display: grid; gap: 8px; }
.label { font: 700 13px/1 var(--display); letter-spacing: .08em; color: var(--dim); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid var(--line); background: var(--slate); color: var(--text); font: 700 15px var(--body); }
.chip[aria-pressed="true"] { border-color: var(--gold); background: #3b3020; color: var(--gold); }
.pal { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.sw { width: 100%; height: 44px; border-radius: 22px; border: 2px solid var(--line); padding: 0; background: conic-gradient(var(--a) 0 50%, var(--b) 0 100%); }
.sw[aria-pressed="true"] { border-color: var(--gold); box-shadow: 0 0 0 2px var(--ink), 0 0 0 4px var(--gold); }
.loom { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.aff { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; padding: 0 6px 0 12px; border-radius: 10px; background: var(--slate); border: 1px solid var(--line); color: var(--text); font: 700 15px var(--body); }
.pips { display: flex; gap: 4px; }
.pip { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--gold-deep); }
.pip.on { background: var(--gold); border-color: var(--gold); box-shadow: 0 0 6px var(--gold); }
.foot { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: center; }
.ghost { min-height: 48px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: transparent; color: var(--text); font: 700 15px var(--body); }
.go { min-height: 56px; border-radius: 14px; border: 0; background: linear-gradient(180deg, var(--gold), var(--gold-deep)); color: #2a1a05; font: 700 19px var(--display); letter-spacing: .05em; }
.go:disabled { filter: grayscale(.7) brightness(.7); }
button { cursor: pointer; }
[hidden] { display: none !important; }
button:focus-visible { outline: 3px solid var(--thread); outline-offset: 2px; }
.bar { height: 6px; border-radius: 3px; background: var(--stone); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--thread), var(--violet)); transition: width .2s; }
.stats { font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; }
.stats b { color: var(--text); font-weight: 700; }
.err { color: #ff9a8a; }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>
<div id="app">
  <section class="stage" id="stage">
    <div class="title"><h1>Hero Painter</h1><span id="gpu">Painted on this device</span></div>
    <div id="prev" hidden></div>
    <canvas id="hero" width="512" height="512" aria-label="Your painted hero"></canvas>
    <canvas id="fx" width="512" height="512"></canvas>
    <div class="say" id="say">Load the painter once (214 MB), then every hero is painted on this phone.</div>
  </section>
  <section class="panel">
    <div class="row" id="loadrow">
      <div class="bar" aria-hidden="true"><i id="bar"></i></div>
    </div>
    <div class="row">
      <div class="label">Garb</div>
      <div class="chips" id="garb"></div>
    </div>
    <div class="row">
      <div class="label">Colours</div>
      <div class="pal" id="pal"></div>
    </div>
    <div class="row">
      <div class="label">Loom ranks &middot; tap to raise</div>
      <div class="loom" id="loom"></div>
    </div>
    <div class="stats" id="stats">No hero painted yet.</div>
    <div class="foot">
      <button class="ghost" id="reroll" type="button">New face</button>
      <button class="go" id="go" type="button">Load painter</button>
    </div>
  </section>
</div>
<script type="module">
__ENGINE__

const $ = (id) => document.getElementById(id);
document.getElementById("stage").style.backgroundImage = "url(bg-hollow-keep.webp)";

const GARBS = [["armour", "Plate"], ["leathers", "Leathers"], ["robes", "Robes"]];
const PALS = [["#9a2a39", "#c9953a"], ["#23408f", "#6a44a3"], ["#1c605a", "#9a6535"], ["#43296f", "#c9953a"], ["#35323a", "#9a2a39"], ["#8f6420", "#1c605a"], ["#d8cfb8", "#23408f"], ["#4a2a15", "#2c8f84"]];
const PAL_NAMES = ["Oxblood and gold", "Sapphire and violet", "Verdigris and rust", "Violet and gold", "Ash and blood", "Ochre and teal", "Bone and sapphire", "Leather and verdigris"];
const AFFS = [["burden", "Burden"], ["veil", "Veil"], ["reach", "Reach"], ["knots", "Knots"], ["flex", "Flex"], ["bond", "Bond"]];
const GLOWS = { burden: "#ffb35c", veil: "#c9a8ff", reach: "#9fc3ff", knots: "#ffd98a", flex: "#7dffd6", bond: "#ff8a7a" };

const state = { garb: "armour", pal: 0, seed: 7, ranks: { burden: 0, veil: 0, reach: 0, knots: 0, flex: 0, bond: 0 } };

function traits() {
  // The strongest Loom affinities shape the look, highest rank first (at most three), right after the garb.
  const ranks = AFFS.map(([k]) => [k, state.ranks[k]]).filter(([, r]) => r > 0).sort((a, b) => b[1] - a[1]).slice(0, 3);
  return [`look.${state.garb}.${state.pal}`, ...ranks.map(([k, r]) => `${k}.${r}`), `weapon.${state.garb}`, "view", "bg", "style"];
}
function topGlow() {
  const best = AFFS.map(([k]) => [k, state.ranks[k]]).sort((a, b) => b[1] - a[1])[0];
  return best[1] > 0 ? GLOWS[best[0]] : "#9fc3ff";
}

// ---------- controls ----------
function renderControls() {
  $("garb").innerHTML = GARBS.map(([k, n]) => `<button class="chip" type="button" data-garb="${k}" aria-pressed="${state.garb === k}">${n}</button>`).join("");
  $("pal").innerHTML = PALS.map(([a, b], i) => `<button class="sw" type="button" data-pal="${i}" aria-label="${PAL_NAMES[i]}" aria-pressed="${state.pal === i}" style="--a:${a};--b:${b}"></button>`).join("");
  $("loom").innerHTML = AFFS.map(([k, n]) => `<button class="aff" type="button" data-aff="${k}" aria-label="${n} rank ${state.ranks[k]} of 3">${n}<span class="pips">${[1, 2, 3].map((r) => `<i class="pip${state.ranks[k] >= r ? " on" : ""}"></i>`).join("")}</span></button>`).join("");
}
renderControls();
document.querySelector(".panel").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.garb) { state.garb = b.dataset.garb; renderControls(); weave("garb"); }
  else if (b.dataset.pal) { state.pal = +b.dataset.pal; renderControls(); weave("colours"); }
  else if (b.dataset.aff) { const k = b.dataset.aff; state.ranks[k] = (state.ranks[k] + 1) % 4; renderControls(); weave(state.ranks[k] ? "rank" : "rank-reset", k); }
});
$("reroll").addEventListener("click", () => { state.seed = (Math.random() * 2 ** 31) | 0; weave("face"); });
$("go").addEventListener("click", () => (painter ? weave("again") : load()));

// ---------- painter ----------
let painter = null, loading = false, busy = false, queued = null;
async function load() {
  if (loading) return; loading = true;
  $("go").disabled = true; $("go").textContent = "Loading…";
  try {
    const t0 = performance.now();
    const manifest = await (await fetch("model/manifest.json")).json();
    painter = await createPainter({
      manifest,
      fetchChunk: async (f) => { const r = await fetch("model/" + f); if (!r.ok) throw new Error(`Download failed (${r.status}) for ${f}.`); return r.arrayBuffer(); },
      onProgress: (p) => { $("bar").style.width = (p * 100).toFixed(1) + "%"; $("say").textContent = `Loading the painter… ${Math.round(p * 214)} of 214 MB`; },
    });
    $("loadrow").hidden = true;
    $("gpu").textContent = painter.gpuName ? `On ${painter.gpuName}` : "Painted on this device";
    $("go").textContent = "Weave hero"; $("go").disabled = false;
    stats.load = (performance.now() - t0) / 1000;
    weave("first");
  } catch (e) {
    $("say").innerHTML = `<span class="err">${e.message}</span>`;
    $("go").textContent = "Try again"; $("go").disabled = false; loading = false;
  }
}

const stats = { load: 0, runs: [] };
function showStats(ms) {
  stats.runs.push(ms.total);
  const avg = stats.runs.reduce((a, b) => a + b, 0) / stats.runs.length;
  $("stats").innerHTML = `Painted in <b>${(ms.total / 1000).toFixed(2)} s</b> (model ${(ms.unet / 1000).toFixed(2)} s, image ${(ms.decode / 1000).toFixed(2)} s, cutout ${(ms.cut / 1000).toFixed(2)} s) \u00b7 average ${(avg / 1000).toFixed(2)} s over ${stats.runs.length} \u00b7 loaded in ${stats.load.toFixed(0)} s`;
}

const SAY = {
  first: "Your hero is woven from the Loom.",
  garb: "Rewoven in new garb.", colours: "Rewoven in new colours.", face: "A new face from the same threads.", again: "Woven again.",
  "rank-reset": "Rank cleared. The look settles back.",
};
async function weave(why, aff) {
  if (!painter) return;
  if (busy) { queued = [why, aff]; return; }
  busy = true; $("go").disabled = true;
  const old = $("hero"); const hadHero = heroDrawn;
  if (hadHero) { $("prev").hidden = false; $("prev").style.backgroundImage = `url(${old.toDataURL("image/webp", 0.7)})`; }
  $("say").textContent = why === "rank" ? `${AFFS.find((a) => a[0] === aff)[1]} rank ${state.ranks[aff]}: the hero is rewoven…` : "Weaving…";
  fx.start(topGlow());
  try {
    const r = await painter.paint({ traits: traits(), seed: state.seed });
    const tm = performance.now();
    const keyed = applyMatte(r.rgba, await painter.matte(r.rgba));
    r.ms.cut = performance.now() - tm; r.ms.total += r.ms.cut;
    await fx.reveal(keyed);
    heroDrawn = true;
    showStats(r.ms);
    $("say").textContent = why === "rank" ? `${AFFS.find((a) => a[0] === aff)[1]} rank ${state.ranks[aff]} shows in the hero's look.` : SAY[why] || "";
  } catch (e) {
    fx.stop(); $("say").innerHTML = `<span class="err">${e.message}</span>`;
  }
  busy = false; $("go").disabled = false;
  if (queued) { const q = queued; queued = null; weave(...q); }
}
let heroDrawn = false;

// Cut-out: the 320x320 matte from the on-device cutout model, scaled up bilinearly to the 512x512 painting.
function applyMatte(rgba, m) {
  const W = 512, S = 320, px = new Uint8ClampedArray(rgba);
  if (!m) return new ImageData(px, W, W);
  for (let y = 0; y < W; y++) {
    const sy = Math.max(0, (y + 0.5) * S / W - 0.5), y0 = Math.min(S - 1, sy | 0), y1 = Math.min(S - 1, y0 + 1), fy = sy - y0;
    for (let x = 0; x < W; x++) {
      const sx = Math.max(0, (x + 0.5) * S / W - 0.5), x0 = Math.min(S - 1, sx | 0), x1 = Math.min(S - 1, x0 + 1), fx = sx - x0;
      const v = (m[y0 * S + x0] * (1 - fx) + m[y0 * S + x1] * fx) * (1 - fy) + (m[y1 * S + x0] * (1 - fx) + m[y1 * S + x1] * fx) * fy;
      px[(y * W + x) * 4 + 3] = Math.min(1, Math.max(0, (v - 0.08) / 0.84)) * 255;
    }
  }
  return new ImageData(px, W, W);
}

// ---------- the materializing weave ----------
const fx = (() => {
  const c = $("fx"), g = c.getContext("2d"), W = 512;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let raf = 0, threads = [], motes = [], color = "#9fc3ff", t0 = 0, mode = "idle", reveal = null;
  // A loose figure the threads gather around: head, shoulders, body, seen from behind.
  const target = () => { const r = Math.random(); if (r < 0.15) return [180 + Math.random() * 40, 120 + Math.random() * 50]; if (r < 0.45) return [120 + Math.random() * 170, 170 + Math.random() * 70]; return [130 + Math.random() * 150, 230 + Math.random() * 250]; };
  const spawn = () => { const side = Math.random() * 4 | 0; const p = [[Math.random() * W, -20], [W + 20, Math.random() * W], [Math.random() * W, W + 20], [-20, Math.random() * W]][side]; const [tx, ty] = target(); return { x: p[0], y: p[1], tx, ty, life: 0, speed: 0.012 + Math.random() * 0.02, w: 0.6 + Math.random() * 1.6, cx: W / 2 + (Math.random() - 0.5) * 400, cy: W / 2 + (Math.random() - 0.5) * 400 }; };
  function frame(now) {
    const t = (now - t0) / 1000;
    g.clearRect(0, 0, W, W);
    if (mode === "weave" || mode === "reveal") {
      if (threads.length < 70 && mode === "weave") for (let i = 0; i < 3; i++) threads.push(spawn());
      g.lineCap = "round";
      for (const th of threads) {
        th.life = Math.min(1, th.life + th.speed);
        const e = 1 - (1 - th.life) ** 3;
        const bx = (1 - e) ** 2 * th.x + 2 * (1 - e) * e * th.cx + e * e * th.tx, by = (1 - e) ** 2 * th.y + 2 * (1 - e) * e * th.cy + e * e * th.ty;
        g.strokeStyle = color; g.globalAlpha = 0.25 + 0.5 * (1 - th.life * 0.6) * (mode === "reveal" ? Math.max(0, 1 - reveal.p * 1.4) : 1);
        g.lineWidth = th.w;
        g.beginPath(); g.moveTo(th.x, th.y); g.quadraticCurveTo(th.cx, th.cy, bx, by); g.stroke();
        if (th.life >= 1 && Math.random() < 0.03) Object.assign(th, spawn());
      }
      // the silhouette glows brighter the longer the weave runs
      const glow = Math.min(1, t / 2.5) * (mode === "reveal" ? Math.max(0, 1 - reveal.p) : 1);
      const rg = g.createRadialGradient(210, 260, 10, 210, 300, 240);
      rg.addColorStop(0, color); rg.addColorStop(1, "transparent");
      g.globalAlpha = 0.18 * glow + 0.06 * Math.sin(t * 5) * glow; g.fillStyle = rg; g.fillRect(0, 0, W, W);
      if (Math.random() < 0.6) motes.push({ x: 120 + Math.random() * 200, y: 200 + Math.random() * 300, v: 0.4 + Math.random(), a: 1 });
      for (const m of motes) { m.y -= m.v; m.a -= 0.012; g.globalAlpha = Math.max(0, m.a); g.fillStyle = "#fff6dc"; g.fillRect(m.x, m.y, 2, 2); }
      motes = motes.filter((m) => m.a > 0);
      g.globalAlpha = 1;
    }
    if (mode === "reveal") revealStep(now);
    raf = requestAnimationFrame(frame);
  }
  // The new hero is drawn onto the hero canvas band by band, like a shuttle crossing the loom.
  const hero = $("hero").getContext("2d");
  let img = null, prevImg = null;
  const BANDS = 32, DUR = reduce ? 1 : 1100;
  function revealStep(now) {
    const p = Math.min(1, (now - reveal.t) / DUR); reveal.p = p;
    hero.clearRect(0, 0, W, W);
    if (prevImg) { hero.globalAlpha = 1 - p; hero.drawImage(prevImg, 0, 0); hero.globalAlpha = 1; }
    const bh = W / BANDS;
    for (let i = 0; i < BANDS; i++) {
      const start = (i / BANDS) * 0.55, q = Math.min(1, Math.max(0, (p - start) / 0.45));
      if (q <= 0) continue;
      const y = W - (i + 1) * bh, left = i % 2 === 0;
      const w = W * q, x = left ? 0 : W - w;
      hero.save(); hero.beginPath(); hero.rect(x, y, w, bh + 0.5); hero.clip(); hero.drawImage(img, 0, 0); hero.restore();
      if (q < 1) { g.globalAlpha = 0.9; g.fillStyle = color; g.fillRect(left ? w - 3 : W - w, y, 3, bh); g.globalAlpha = 1; }
    }
    if (p >= 1) { mode = "idle"; reveal.done(); }
  }
  return {
    start(col) { color = col; if (mode === "idle") { threads = []; t0 = performance.now(); } mode = "weave"; if (!raf) raf = requestAnimationFrame(frame); },
    stop() { mode = "idle"; },
    reveal(imageData) {
      return new Promise(async (res) => {
        prevImg = heroDrawn ? await createImageBitmap($("hero")) : null;
        img = await createImageBitmap(imageData);
        reveal = { t: performance.now(), p: 0, done: res };
        mode = "reveal";
      });
    },
  };
})();

if (!navigator.gpu) {
  $("say").innerHTML = `<span class="err">This browser has no WebGPU, so it can't paint heroes. Safari on iOS 26 or recent Chrome on Android can.</span>`;
  $("go").disabled = true;
}
</script>
